name: Replace GitHub Actions bot attribution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-contributors.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reattribute bot commits to the repository owner
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git checkout main

          if ! git log main --format='%an <%ae> %cn <%ce>' | grep -Fq 'github-actions[bot]'; then
            echo "No GitHub Actions bot identity remains in main history."
            exit 0
          fi

          git config user.name "Pallavi Behura"
          git config user.email "pallavibehura@gmail.com"

          # Remove this one-off workflow from the final repository tree.
          git rm .github/workflows/rewrite-contributors.yml
          git commit -m "Remove temporary contributor cleanup workflow"

          # Change only the bot's name/email; keep all existing commit dates,
          # messages, snapshots, and the parent/merge structure.
          git filter-branch --force --env-filter '
            if [ "$GIT_AUTHOR_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ] || [ "$GIT_AUTHOR_NAME" = "github-actions[bot]" ]; then
              export GIT_AUTHOR_NAME="Pallavi Behura"
              export GIT_AUTHOR_EMAIL="pallavibehura@gmail.com"
            fi
            if [ "$GIT_COMMITTER_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ] || [ "$GIT_COMMITTER_NAME" = "github-actions[bot]" ]; then
              export GIT_COMMITTER_NAME="Pallavi Behura"
              export GIT_COMMITTER_EMAIL="pallavibehura@gmail.com"
            fi
          ' main

          if git log main --format='%an <%ae> %cn <%ce>' | grep -Fq 'github-actions[bot]'; then
            echo "Bot identity still appears in the rewritten branch; refusing to push."
            exit 1
          fi

          # Use a lease so this fails safely if main changed while rewriting.
          git push --force-with-lease="refs/heads/main:$EXPECTED_HEAD" origin main
