name: Import upstream FFT reports

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream-reports.yml"

permissions:
  contents: write

jobs:
  import-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import reports while retaining source commit messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --quiet https://github.com/RohanCoderiiitb/FFT-Processor-Design.git "$RUNNER_TEMP/source"
          python3 - <<'PY'
          import os, shutil, subprocess
          from collections import defaultdict
          from pathlib import Path

          target = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          source = Path(os.environ["RUNNER_TEMP"]) / "source"

          def git(cwd, *args):
              p = subprocess.run(["git", *args], cwd=cwd, text=True,
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if p.returncode:
                  raise RuntimeError(p.stderr)
              return p.stdout

          source_head = git(source, "rev-parse", "origin/main").strip()
          paths = sorted(p for p in git(source, "ls-tree", "-r", "--name-only",
                                        source_head, "--", "reports/").splitlines()
                         if p.startswith("reports/"))
          if not paths:
              raise RuntimeError("Source reports/ directory is empty.")
          if any(not p.endswith(".csv") for p in paths):
              raise RuntimeError("Unexpected non-CSV file found under reports/.")

          destination_reports = target / "reports"
          if destination_reports.exists() and any(destination_reports.iterdir()):
              raise RuntimeError("Destination reports/ is not empty; refusing to overwrite.")

          commits = git(source, "log", "--full-history", "--topo-order", "--reverse",
                         "--format=%H", source_head, "--", "reports/").splitlines()
          last_touch = {}
          for commit in commits:
              parents = git(source, "rev-list", "--parents", "-n", "1", commit).split()
              if len(parents) > 1:
                  changes = git(source, "diff-tree", "--no-commit-id", "--name-status",
                                "-r", "--find-renames", parents[1], commit, "--",
                                "reports/").splitlines()
              else:
                  names = git(source, "ls-tree", "-r", "--name-only", commit, "--",
                              "reports/").splitlines()
                  changes = ["A\t" + name for name in names]
              for line in changes:
                  parts = line.split("\t")
                  status = parts[0]
                  if status.startswith(("R", "C")) and len(parts) >= 3:
                      last_touch.pop(parts[1], None)
                      last_touch[parts[2]] = commit
                  elif status == "D" and len(parts) >= 2:
                      last_touch.pop(parts[1], None)
                  elif len(parts) >= 2:
                      last_touch[parts[1]] = commit

          for path in paths:
              last_touch.setdefault(path, source_head)

          commit_order = {sha: i for i, sha in enumerate(commits)}
          groups = defaultdict(list)
          for path in paths:
              groups[last_touch[path]].append(path)

          copied = 0
          committed = 0
          for sha in sorted(groups, key=lambda s: commit_order.get(s, len(commits))):
              for rel in sorted(groups[sha]):
                  src_file = source / rel
                  dst_file = target / rel
                  dst_file.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src_file, dst_file)

              git(target, "add", "--", "reports/")
              if subprocess.run(["git", "diff", "--cached", "--quiet"],
                                cwd=target).returncode == 0:
                  continue
              message = git(source, "show", "-s", "--format=%B", sha).rstrip()
              if not message:
                  raise RuntimeError("Source commit had an empty commit message: " + sha)
              msg_path = target / ".git" / "IMPORT_COMMIT_MESSAGE"
              msg_path.write_text(message + "\n", encoding="utf-8")
              try:
                  git(target, "commit", "-F", str(msg_path))
              finally:
                  msg_path.unlink(missing_ok=True)
              copied += len(groups[sha])
              committed += 1

          actual = sorted(str(p.relative_to(target)).replace(os.sep, "/")
                          for p in destination_reports.rglob("*") if p.is_file())
          if actual != paths:
              raise RuntimeError(f"Verification failed: source={len(paths)}, target={len(actual)}")
          print(f"Imported and verified {len(paths)} report CSV files in {committed} commits.")
          PY
          git push origin HEAD:main
