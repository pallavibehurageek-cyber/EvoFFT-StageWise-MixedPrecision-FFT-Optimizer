name: Import Vivado u artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-vivado-u.yml"

permissions:
  contents: write

jobs:
  import-vivado-u:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EvoFFT
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy the selected upstream u directory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --quiet https://github.com/RohanCoderiiitb/FFT-Processor-Design.git "$RUNNER_TEMP/source"

          source_root="$RUNNER_TEMP/source/.Xil/Vivado-28389-iiitb-OptiPlex-7080/incrSyn/775969279/u"
          target_root="Vivado-28389-brecw-OptiPlex-7080/incrSyn/775969279/u"

          test -d "$source_root"
          if [ -e "$target_root" ]; then
            echo "Destination already exists; refusing to overwrite."
            exit 1
          fi

          files=(
            "childModToGenomes.map"
            "e/elab.rtd"
            "g/global_name.straps.rtd"
            "g/instToEncGenName.map"
            "genomeDependencyGraph.out"
            "genomes.map"
            "genomes.txt"
            "parentModToGenomes.map"
            "synthNameToElabName.map"
            "t/design.rtd"
            "t/files.rtd"
            "t/straps.rtd"
            "topModuleToGenome.map"
          )

          for relative_path in "${files[@]}"; do
            source_file="$source_root/$relative_path"
            target_file="$target_root/$relative_path"
            test -f "$source_file"
            mkdir -p "$(dirname "$target_file")"
            cp "$source_file" "$target_file"
          done

          actual_count=$(find "$target_root" -type f | wc -l | tr -d ' ')
          if [ "$actual_count" -ne "${#files[@]}" ]; then
            echo "Expected ${#files[@]} files but found $actual_count"
            exit 1
          fi

          git add -- "$target_root"
          git commit -m "Switched back to SQNR"
          git push origin HEAD:main
