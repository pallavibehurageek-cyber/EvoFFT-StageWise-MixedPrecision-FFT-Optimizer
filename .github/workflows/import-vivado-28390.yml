name: Import Vivado 28390 u and realtime artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-vivado-28390.yml"

permissions:
  contents: write

jobs:
  import-vivado-28390:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EvoFFT
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy requested upstream artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --quiet https://github.com/RohanCoderiiitb/FFT-Processor-Design.git "$RUNNER_TEMP/source"

          source_base="$RUNNER_TEMP/source/.Xil/Vivado-28390-iiitb-OptiPlex-7080"
          source_u="$source_base/incrSyn/3312968444/u"
          source_realtime="$source_base/realtime"
          target_base="Vivado-28390-brecw-OptiPlex-7080"
          target_u="$target_base/incrSyn/3312968444/u"
          target_realtime="$target_base/realtime"

          test -d "$source_u"
          test -d "$source_realtime"
          if [ -e "$target_u" ] || [ -e "$target_realtime" ]; then
            echo "One or more target directories already exist; refusing to overwrite."
            exit 1
          fi

          u_files=(
            "childModToGenomes.map"
            "e/elab.rtd"
            "g/global_name.straps.rtd"
            "g/instToEncGenName.map"
            "genomeDependencyGraph.out"
            "genomes.map"
            "genomes.txt"
            "parentModToGenomes.map"
            "synthNameToElabName.map"
            "t/design.rtd"
            "t/files.rtd"
            "t/straps.rtd"
            "topModuleToGenome.map"
          )

          realtime_files=(
            "dupFiles.rpt"
            "fft_16_sol2_gen1_top.tcl"
            "tmp/genlib.6EE6.0"
            "tmp/genlib.6EE6.0_temp"
            "tmp/genlib.6EE6.super"
          )

          for relative_path in "${u_files[@]}"; do
            source_file="$source_u/$relative_path"
            target_file="$target_u/$relative_path"
            test -f "$source_file"
            mkdir -p "$(dirname "$target_file")"
            cp "$source_file" "$target_file"
          done

          for relative_path in "${realtime_files[@]}"; do
            source_file="$source_realtime/$relative_path"
            target_file="$target_realtime/$relative_path"
            test -f "$source_file"
            mkdir -p "$(dirname "$target_file")"
            cp "$source_file" "$target_file"
          done

          actual_u_count=$(find "$target_u" -type f | wc -l | tr -d ' ')
          actual_realtime_count=$(find "$target_realtime" -type f | wc -l | tr -d ' ')
          if [ "$actual_u_count" -ne "${#u_files[@]}" ]; then
            echo "Expected ${#u_files[@]} u files but found $actual_u_count"
            exit 1
          fi
          if [ "$actual_realtime_count" -ne "${#realtime_files[@]}" ]; then
            echo "Expected ${#realtime_files[@]} realtime files but found $actual_realtime_count"
            exit 1
          fi

          rm -f .github/workflows/import-vivado-28390.yml
          git add -A -- "$target_u" "$target_realtime" .github/workflows/import-vivado-28390.yml
          git commit -m "Switched back to SQNR"
          git push origin HEAD:main
